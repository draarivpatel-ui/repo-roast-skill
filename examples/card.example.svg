<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Roast of fictional-co/snackstack: 5.1 out of 10, Needs Seasoning">
<title>Roast of fictional-co/snackstack: 5.1 out of 10, Needs Seasoning</title>
<defs><linearGradient id="flame" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f59f00"/><stop offset="1" stop-color="#d9480f"/></linearGradient></defs>
<rect width="1200" height="630" fill="#fffaf3"/>
<rect width="1200" height="10" fill="url(#flame)"/>
<g font-family="&apos;Segoe UI&apos;, -apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif">
<text x="60" y="70" font-size="18" font-weight="700" letter-spacing="3" fill="#d9480f">THE ROAST OF</text>
<text x="60" y="118" font-size="42" font-weight="800" fill="#1f2328">fictional-co/snackstack</text>
<text x="1140" y="70" font-size="16" fill="#57606a" text-anchor="end">2026-11-07 · default mode</text>
<line x1="60" y1="150" x2="1140" y2="150" stroke="#eee3d6" stroke-width="2"/>
<circle cx="230" cy="320" r="112" fill="none" stroke="#eee3d6" stroke-width="20"/>
<circle cx="230" cy="320" r="112" fill="none" stroke="#d9480f" stroke-width="20" stroke-linecap="round" stroke-dasharray="358.9 703.7" transform="rotate(-90 230 320)"/>
<text x="230" y="342" font-size="76" font-weight="800" fill="#1f2328" text-anchor="middle">5.1</text>
<text x="230" y="378" font-size="20" fill="#57606a" text-anchor="middle">out of 10</text>
<text x="230" y="482" font-size="28" font-weight="800" fill="#d9480f" text-anchor="middle">Needs Seasoning</text>
<text x="230" y="518" font-size="18" font-style="italic" fill="#57606a" text-anchor="middle">Great recipes, leaky kitchen: one</text>
<text x="230" y="544" font-size="18" font-style="italic" fill="#57606a" text-anchor="middle">key, one f-string and no CI away</text>
<text x="230" y="570" font-size="18" font-style="italic" fill="#57606a" text-anchor="middle">from fine.</text>
<text x="470" y="190" font-size="20" font-weight="700" fill="#1f2328">The Paranoid<tspan fill="#57606a" font-weight="400"> · Security</tspan></text>
<text x="1140" y="190" font-size="22" font-weight="800" text-anchor="end" fill="#c62828">3.5</text>
<rect x="470" y="200" width="670" height="8" rx="4" fill="#eee3d6"/>
<rect x="470" y="200" width="234.5" height="8" rx="4" fill="#c62828"/>
<text x="470" y="226" font-size="16" font-style="italic" fill="#57606a">“Recipe search sends user input straight to SQL. Bon appetit, attackers.”</text>
<text x="470" y="260" font-size="20" font-weight="700" fill="#1f2328">The Stopwatch<tspan fill="#57606a" font-weight="400"> · Performance</tspan></text>
<text x="1140" y="260" font-size="22" font-weight="800" text-anchor="end" fill="#d9480f">5.5</text>
<rect x="470" y="270" width="670" height="8" rx="4" fill="#eee3d6"/>
<rect x="470" y="270" width="368.5" height="8" rx="4" fill="#d9480f"/>
<text x="470" y="296" font-size="16" font-style="italic" fill="#57606a">“One query per ingredient per recipe. The database has filed for overtime.”</text>
<text x="470" y="330" font-size="20" font-weight="700" fill="#1f2328">The New Hire<tspan fill="#57606a" font-weight="400"> · Newcomer</tspan></text>
<text x="1140" y="330" font-size="22" font-weight="800" text-anchor="end" fill="#b7791f">6.0</text>
<rect x="470" y="340" width="670" height="8" rx="4" fill="#eee3d6"/>
<rect x="470" y="340" width="402.0" height="8" rx="4" fill="#b7791f"/>
<text x="470" y="366" font-size="16" font-style="italic" fill="#57606a">“Lovely pitch, then step 3 sends me to a script that does not exist.”</text>
<text x="470" y="400" font-size="20" font-weight="700" fill="#1f2328">The Greybeard<tspan fill="#57606a" font-weight="400"> · Maintainer</tspan></text>
<text x="1140" y="400" font-size="22" font-weight="800" text-anchor="end" fill="#d9480f">4.0</text>
<rect x="470" y="410" width="670" height="8" rx="4" fill="#eee3d6"/>
<rect x="470" y="410" width="268.0" height="8" rx="4" fill="#d9480f"/>
<text x="470" y="436" font-size="16" font-style="italic" fill="#57606a">“utils.py is 1,212 lines. It is not a module, it is a lifestyle.”</text>
<text x="470" y="470" font-size="20" font-weight="700" fill="#1f2328">The User<tspan fill="#57606a" font-weight="400"> · Product</tspan></text>
<text x="1140" y="470" font-size="22" font-weight="800" text-anchor="end" fill="#b7791f">6.5</text>
<rect x="470" y="480" width="670" height="8" rx="4" fill="#eee3d6"/>
<rect x="470" y="480" width="435.5" height="8" rx="4" fill="#b7791f"/>
<text x="470" y="506" font-size="16" font-style="italic" fill="#57606a">“&apos;Something went wrong&apos; is not an error message, it is a weather report.”</text>
<text x="470" y="540" font-size="20" font-weight="700" fill="#1f2328">The On-Call<tspan fill="#57606a" font-weight="400"> · Ops</tspan></text>
<text x="1140" y="540" font-size="22" font-weight="800" text-anchor="end" fill="#d9480f">5.0</text>
<rect x="470" y="550" width="670" height="8" rx="4" fill="#eee3d6"/>
<rect x="470" y="550" width="335.0" height="8" rx="4" fill="#d9480f"/>
<text x="470" y="576" font-size="16" font-style="italic" fill="#57606a">“FROM python:latest. A build that changes every week, like a mystery box.”</text>
<text x="60" y="612" font-size="15" fill="#57606a">Roast the code, never the people. Every jab comes with evidence and a fix.</text>
<text x="1140" y="612" font-size="15" font-weight="700" fill="#d9480f" text-anchor="end">repo-roast-skill</text>
</g></svg>
